name: Untitled track killer

on:
  workflow_dispatch:
    inputs:
      mega_source:
        description: "Ruta INTERNA de tu cuenta MEGA (no un link publico - hace falta poder listar y borrar dentro de ella). Ej: /musica"
        required: false
        default: ""
      batch_size:
        description: "Maximo de canciones a procesar en esta corrida"
        required: false
        default: "100"
  schedule:
    - cron: '0 */5 * * *'  # cada 5 horas

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
      MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
      DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      # Los runs por schedule no tienen "inputs" (son solo de workflow_dispatch),
      # por eso el fallback a vars.MEGA_SOURCE_PATH - hay que configurar esa
      # variable de repo (Settings > Secrets and variables > Actions > Variables)
      # para que las corridas automaticas sepan de donde leer.
      MEGA_SOURCE: ${{ github.event.inputs.mega_source || vars.MEGA_SOURCE_PATH }}
      MEGA_DEST: "/untitledless"
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MEGAcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb
          sudo apt-get install -y ./megacmd-xUbuntu_24.04_amd64.deb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Verificar que MEGA_SOURCE este configurado
        run: |
          if [ -z "$MEGA_SOURCE" ]; then
            echo "ERROR: no hay MEGA_SOURCE. Para corridas manuales, completa el input. Para corridas automaticas (schedule), configura la variable de repo MEGA_SOURCE_PATH."
            exit 1
          fi

      - name: Correr el bot
        run: bash scripts/run.sh
